# Codemagic CI — iOS build + TestFlight upload for Ninoz.
#
# Why this is so short: Ninoz uses Capacitor "Option A" — the native app is a
# thin shell whose WebView loads the LIVE site (https://ninoz.app). The web app
# is NOT bundled into the binary, so there is no `npm run build` step here.
# `capacitor-webroot/` (the offline fallback page) is the only web asset copied.
#
# Consequence: content/UI/logic changes ship by deploying the website, NOT by
# rebuilding here. Only *native* changes (icon, splash, permissions, plugins,
# capacitor.config.ts) need a build from this workflow.
#
# There is deliberately no `triggering:` block — pushing to master must NOT burn
# build minutes on an iOS rebuild that ships nothing. Start builds manually from
# the Codemagic UI when a native change actually needs to go out.

workflows:
  ios-release:
    name: Ninoz iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Name of the App Store Connect API key as saved in
      # Codemagic → Teams/Personal Account → Integrations → App Store Connect.
      # Must match EXACTLY. Created in step 5.
      app_store_connect: Ninoz App Store Connect

    environment:
      groups:
        # Must contain CERTIFICATE_PRIVATE_KEY: an RSA private key, marked
        # secure, added in Codemagic → Environment variables. Signing
        # certificates cannot be saved without it — `fetch-signing-files`
        # then creates a certificate on the Apple account but keeps nothing
        # locally, and signing fails with "Did not find any certificates".
        # The same key must persist across builds: the certificate on Apple's
        # side is bound to it, and a key that only exists inside one build
        # machine is lost when that machine is destroyed.
        - appstore_credentials
      node: 22
      xcode: latest
      # NOTE: no `cocoapods:` key — Capacitor 8 generates a Swift Package Manager
      # project (ios/App/CapApp-SPM), not a Podfile. Xcode resolves the packages
      # itself during the build. Adding a `pod install` step here would fail.
      #
      # NOTE: no `ios_signing:` block. That block makes Codemagic look for an
      # ALREADY-EXISTING provisioning profile and fail with "No matching profiles
      # found" when there isn't one. Signing is done explicitly in the scripts
      # below instead, where `--create` generates the certificate and profile on
      # first run. Do not add `ios_signing` back — mixing the two breaks signing.
      vars:
        BUNDLE_ID: "app.ninoz"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync Capacitor config and plugins into the iOS project
        script: npx cap sync ios

      - name: Set build number
        # Runs BEFORE code signing on purpose: `agvtool` rewrites
        # project.pbxproj, and the signing step patches that same file with the
        # team, profile and identity. Signing must therefore be the last thing
        # to touch it.
        #
        # PROJECT_BUILD_NUMBER is Codemagic's own per-app counter, so this works
        # on the very first build — before any build exists in App Store Connect.
        # (The `app-store-connect get-latest-app-store-build-number` approach used
        # in many examples fails on a brand-new app that has no builds yet.)
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Set up code signing
        # `--create` generates the distribution certificate and provisioning
        # profile when the Apple account has none yet, and `--certificate-key`
        # is what lets the certificate actually be saved to this machine.
        # Later builds reuse the certificate bound to that same private key.
        #
        # The checks below exist because `fetch-signing-files` exits 0 even when
        # it saves nothing (it only warns), so a green step proved nothing and
        # the failure surfaced much later as a misleading Xcode error about a
        # missing provisioning profile. Each check fails at the actual broken
        # link and says which one it is.
        script: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "FAILED: CERTIFICATE_PRIVATE_KEY is empty or not visible to this workflow."
            echo "The variable must be in the 'appstore_credentials' group, and that"
            echo "group must be listed under environment.groups in codemagic.yaml."
            exit 1
          fi
          echo "CERTIFICATE_PRIVATE_KEY is present (${#CERTIFICATE_PRIVATE_KEY} characters)."

          # Accept the key either as a plain PEM or base64-encoded. Codemagic's
          # environment variable page says binaries must be base64-encoded, which
          # is easy to apply to a PEM too, so both forms show up in practice.
          KEY_FILE="$CM_BUILD_DIR/signing_key.pem"
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$KEY_FILE.raw"

          if grep -q 'PRIVATE KEY' "$KEY_FILE.raw"; then
            echo "Value is a PEM private key."
            cp "$KEY_FILE.raw" "$KEY_FILE"
          else
            tr -d '\n\r ' < "$KEY_FILE.raw" > "$KEY_FILE.stripped"
            if openssl base64 -d -A -in "$KEY_FILE.stripped" -out "$KEY_FILE.decoded" 2>/dev/null \
               && grep -q 'PRIVATE KEY' "$KEY_FILE.decoded"; then
              echo "Value is base64-encoded; decoded it to a PEM."
              cp "$KEY_FILE.decoded" "$KEY_FILE"
            else
              echo "FAILED: CERTIFICATE_PRIVATE_KEY is neither a PEM nor base64-encoded PEM."
              echo "Diagnostics (no key material shown):"
              echo "  length:            ${#CERTIFICATE_PRIVATE_KEY}"
              echo "  starts with '-':   $(case "$CERTIFICATE_PRIVATE_KEY" in -*) echo yes;; *) echo no;; esac)"
              echo "  contains newlines: $(if printf '%s' "$CERTIFICATE_PRIVATE_KEY" | grep -q '^.*$' && [ "$(printf '%s' "$CERTIFICATE_PRIVATE_KEY" | wc -l | tr -d ' ')" != "0" ]; then echo yes; else echo no; fi)"
              echo "  base64 charset:    $(if printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d '\n\r ' | grep -qE '^[A-Za-z0-9+/=]+$'; then echo yes; else echo no; fi)"
              echo
              echo "Regenerate with:  openssl genrsa -out codemagic_private_key.pem 2048"
              echo "and paste the file's entire contents, including the BEGIN and END lines."
              exit 1
            fi
          fi

          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "FAILED: the value decoded to something that is not a usable private key."
            exit 1
          fi
          echo "Private key parsed successfully."

          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$KEY_FILE" \
            --create

          keychain add-certificates

          echo "--- signing certificates in keychain ---"
          keychain list-certificates \
            | grep -E '"(name|common_name|serial_number)"' || echo "(none listed)"

          echo "--- provisioning profiles on disk ---"
          ls -la "$PROFILE_DIR" 2>/dev/null || echo "(directory does not exist)"

          PROFILE_COUNT=0
          if [ -d "$PROFILE_DIR" ]; then
            PROFILE_COUNT=$(find "$PROFILE_DIR" -name '*.mobileprovision' | wc -l | tr -d ' ')
          fi

          if [ "$PROFILE_COUNT" -eq 0 ]; then
            echo "FAILED: no provisioning profile was saved for $BUNDLE_ID."
            echo "The certificate could not be created or matched, so there is nothing"
            echo "to sign the archive with. Check the fetch-signing-files output above:"
            echo "  - 'Cannot save Signing Certificates without certificate private key'"
            echo "    means the private key was not accepted."
            echo "  - a certificate limit error means the orphaned distribution"
            echo "    certificate from an earlier build must be revoked at"
            echo "    developer.apple.com > Certificates."
            exit 1
          fi
          echo "Saved $PROFILE_COUNT provisioning profile(s)."

          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --code-signing-setup-verbose-logging

          echo "--- signing settings written into the project ---"
          grep -E 'DEVELOPMENT_TEAM|PROVISIONING_PROFILE|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY' \
            "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj" || true

          if ! grep -q 'PROVISIONING_PROFILE_SPECIFIER' \
               "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"; then
            echo "FAILED: use-profiles did not write a provisioning profile into the project."
            echo "A profile exists on disk but was not matched to the App target —"
            echo "compare the bundle id in the profile above with $BUNDLE_ID."
            exit 1
          fi
          echo "Code signing settings applied to the project."

      - name: Build signed IPA
        # --project, not --workspace: SPM project has no .xcworkspace of its own.
        #
        # --archive-flags pins the destination to iOS. Without it, xcodebuild can
        # resolve the archive to a Mac destination (TARGETED_DEVICE_FAMILY "1,2"
        # means the app is eligible to run on Apple Silicon as "Designed for
        # iPad"), and the iOS App Store provisioning profile does not match a Mac
        # destination — which surfaces as the misleading error
        # `"App" requires a provisioning profile`.
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight only. Flip submit_to_app_store to true (or submit
        # from App Store Connect by hand) once TestFlight testing looks good.
        submit_to_testflight: true
        submit_to_app_store: false
